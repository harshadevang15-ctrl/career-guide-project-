<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Quiz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4e54c8, #8f94fb); /* Royal gradient */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #00c9a7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #00b89f;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>Question {{ index }}</h2>
        <p>{{ question.question }}</p>
        <form method="POST">
            {% for opt in question.options %}
                <label>
                    <input type="radio" name="answer" value="{{ opt[0]|lower }}" required> {{ opt }}
                </label><br>
            {% endfor %}
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
