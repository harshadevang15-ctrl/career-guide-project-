<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4e54c8, #8f94fb); /* Royal gradient */
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Main Container Styles */
        .recommendation-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            width: 90%;
            max-width: 800px; /* Updated max width */
            box-sizing: border-box;
            max-height: 70vh; /* Limit height */
            overflow-y: auto; /* Enable scrolling if content overflows */
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 18px;
            margin: 10px 0;
        }

        a {
            text-decoration: none;
            font-size: 18px;
            color: #00c9a7;
            margin-top: 20px;
            display: inline-block;
            text-transform: uppercase;
        }

        a:hover {
            color: #00b89f;
        }

        button {
            background-color: #00c9a7;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #00b89f;
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            .recommendation-container {
                padding: 20px;
                width: 95%;
            }

            h2 {
                font-size: 24px;
            }

            p, li {
                font-size: 16px;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .recommendation-container {
                width: 95%;
                padding: 15px;
            }

            h2 {
                font-size: 22px;
            }

            p, li {
                font-size: 14px;
            }

            button {
                padding: 8px 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="recommendation-container">
        <h2>Recommendation for {{ category | capitalize }}</h2>
        <p>{{ recommendation }}</p>

        <h3>Recommended Courses:</h3>
        <ul>
            {% for course in courses %}
                <li>{{ course }}</li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('result') }}">Back to Results</a>
    </div>
</body>
</html>
