<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Quiz Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4e54c8, #8f94fb); /* Royal gradient */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #00c9a7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #00b89f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Your Skill Set</h2>
        <form method="POST">
            <input type="text" name="skill" placeholder="e.g., Python, Web, Communication" required>
            <br>
            <button type="submit">Generate Quiz</button>
        </form>
    </div>
</body>
</html>
