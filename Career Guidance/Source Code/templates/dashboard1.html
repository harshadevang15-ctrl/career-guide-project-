<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Portal</title>
    <style>
        /* Reset and modern font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c, #928dab); /* Royal gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 350px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 600;
            color: #f8f9fa;
        }

        .btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #d1d1d1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Career Guidance Portal</h1>
        <a href="{{ url_for('register') }}" class="btn">Register</a>
        <a href="{{ url_for('login') }}" class="btn">Login</a>
        <div class="footer">Empowering Your Future. One Step at a Time.</div>
    </div>
</body>
</html>
